# config/packages/security.yaml
security:
  firewalls:
    # API = no session, no login form
    api:
      pattern: ^/api
      stateless: true
      # add your token/JWT authenticator here later if needed

    # Site (everything except /api)
    main:
      pattern: ^/(?!api)
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\LoginFormAuthenticator
      logout:
        path: app_logout
        target: /
  access_control:
    - { path: ^/api, roles: PUBLIC_ACCESS }
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/inscription, roles: PUBLIC_ACCESS }
    - { path: ^/cercles, roles: ROLE_CITOYEN }
    - { path: ^/, roles: PUBLIC_ACCESS }